<div role="main" class="main-content">
  <div class="page-content container container-plus">
    <div class="card-header">
      <h3 class="card-title text-125 text-primary-d2">
        <i class="fa fa-truck text-dark-l3 mr-1"></i>
        Despachar transferencia {{ TransferCod }}
      </h3>
    </div>

    <div class="card dcard">
      <div class="card-body">
        <h5 class="text-primary">Productos solicitados</h5>
        <div class="table-responsive mb-3">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Producto</th>
                <th class="text-center">Cantidad</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let det of detailList">
                <td>{{ det.Product?.ProductName || det.ProductCod }}</td>
                <td class="text-center">
                  <input type="number" class="form-control" style="max-width: 120px;" [(ngModel)]="det.NumUnit" />
                </td>
              </tr>
              <tr *ngIf="detailList.length === 0">
                <td colspan="2" class="text-center text-muted">Sin productos</td>
              </tr>
            </tbody>
          </table>
        </div>

        <h5 class="text-primary">Datos de transporte</h5>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Modalidad</label>
            <select class="form-control" #cboTransportMode>
              <option value="">Seleccione</option>
              <option *ngFor="let mode of transportModeList" [value]="mode.Code">
                {{ mode.Name }}
              </option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label>Motivo de traslado</label>
            <select class="form-control" #cboReason>
              <option value="">Seleccione</option>
              <option *ngFor="let reason of reasonTransferList" [value]="reason.Code">
                {{ reason.Name }}
              </option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label>Placa vehículo</label>
            <input type="text" class="form-control" #txtVehiclePlate />
          </div>
          <div class="col-md-4 mb-3">
            <label>Tipo doc. conductor</label>
            <input type="text" class="form-control" #txtDriverDocType />
          </div>
          <div class="col-md-4 mb-3">
            <label>N° doc. conductor</label>
            <input type="text" class="form-control" #txtDriverDocNumber />
          </div>
          <div class="col-md-4 mb-3">
            <label>Licencia conductor</label>
            <input type="text" class="form-control" #txtDriverLicenseNumber />
          </div>
          <div class="col-md-4 mb-3">
            <label>RUC transportista</label>
            <input type="text" class="form-control" #txtCarrierRuc />
          </div>
          <div class="col-md-8 mb-3">
            <label>Nombre transportista</label>
            <input type="text" class="form-control" #txtCarrierName />
          </div>
          <div class="col-md-12 mb-3">
            <label>Observación</label>
            <textarea class="form-control" rows="2" #txtObservation></textarea>
          </div>
        </div>

        <div class="mt-3">
          <button class="btn btn-success" data-toggle="modal" data-target="#modal_dispatch">
            Despachar
          </button>
          <a class="btn btn-secondary ml-2" href="enterprise/transfer/pages/listtransferdispatch">Cancelar</a>
        </div>
      </div>
    </div>
  </div>
</div>

<app-modalconfirm
  [id]="'modal_dispatch'"
  [title]="'Confirmar despacho'"
  [message]="'¿Desea despachar esta transferencia?'"
  [action]="this">
</app-modalconfirm>
